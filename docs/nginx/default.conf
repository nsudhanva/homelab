include /etc/nginx/conf.d/md-redirects.map;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    if ($host = docs.sudhanva.me) {
        return 301 https://homelab.sudhanva.me$request_uri;
    }

    if ($md_redirect) {
        return 301 $md_redirect;
    }

    location ~ ^/docs(/|$) {
        rewrite ^/docs/?(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
