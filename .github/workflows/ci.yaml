name: CI

on:
  pull_request:
    paths-ignore:
    - "apps/**/.argocd-source-*.yaml"
  push:
    branches:
    - master
    paths-ignore:
    - "apps/**/.argocd-source-*.yaml"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install pre-commit
      run: pip install pre-commit==4.5.1
    - name: Run pre-commit
      run: pre-commit run --all-files

  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install gitleaks
      run: |
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
    - name: Scan repository history for secrets
      run: gitleaks git --redact --verbose

  docs-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Detect docs changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          docs:
            - "docs/**"
            - ".github/workflows/ci.yaml"
    - name: Set up Bun
      if: steps.changes.outputs.docs == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Install dependencies
      if: steps.changes.outputs.docs == 'true'
      run: bun install --frozen-lockfile
      working-directory: docs
    - name: Build docs
      if: steps.changes.outputs.docs == 'true'
      run: bun --bun run build
      working-directory: docs

  docs-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-docs
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Detect docs changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          docs:
            - "docs/**"
            - ".github/workflows/ci.yaml"
    - name: Set up QEMU
      if: steps.changes.outputs.docs == 'true'
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      if: steps.changes.outputs.docs == 'true'
      uses: docker/setup-buildx-action@v4
    - name: Log in to the Container registry
      if: steps.changes.outputs.docs == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      if: steps.changes.outputs.docs == 'true'
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=sha,format=short
    - name: Build and push docs image
      if: steps.changes.outputs.docs == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ./docs
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  python-changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      images: ${{ steps.select.outputs.images }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Discover Python projects
      id: discover
      run: |
        projects=$(for file in apps/*/pyproject.toml packages/*/pyproject.toml; do
          dir=$(dirname "$file")
          jq -n --arg name "$(basename "$dir")" --arg path "$dir" \
            --argjson image "$([ -f "$dir/Dockerfile" ] && echo true || echo false)" \
            '{name: $name, path: $path, image: $image}'
        done | jq -sc .)
        echo "projects=$projects" >> "$GITHUB_OUTPUT"
        {
          echo "filters<<EOF"
          jq -r '.[] | "\(.name):\n  - \"\(.path)/**\"\n  - \"packages/homelab-ai/**\"\n  - \".github/workflows/ci.yaml\""' <<< "$projects"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Detect changed projects
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: ${{ steps.discover.outputs.filters }}
    - name: Select changed projects
      id: select
      env:
        CHANGED: ${{ steps.changes.outputs.changes }}
        PROJECTS: ${{ steps.discover.outputs.projects }}
      run: |
        projects=$(jq -c --argjson changed "$CHANGED" '[.[] | select(.name as $n | $changed | index($n))]' <<< "$PROJECTS")
        echo "projects=$projects" >> "$GITHUB_OUTPUT"
        echo "images=$(jq -c '[.[] | select(.image)]' <<< "$projects")" >> "$GITHUB_OUTPUT"

  python-test:
    name: test (${{ matrix.name }})
    needs: python-changes
    if: needs.python-changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.python-changes.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install 3.12
    - name: Run ruff lint
      run: uv run ruff check
    - name: Run ruff format check
      run: uv run ruff format --check
    - name: Run ty type check
      run: uv run ty check
    - name: Run unit tests
      run: uv run pytest

  image-push:
    name: push (${{ matrix.name }})
    needs: [python-changes, python-test]
    if: github.event_name == 'push' && needs.python-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.python-changes.outputs.images) }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
        tags: |
          type=raw,value=latest
          type=sha,format=short
    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ matrix.path }}/Dockerfile
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
