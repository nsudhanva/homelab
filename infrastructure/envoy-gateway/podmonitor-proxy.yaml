apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy-metrics
  namespace: envoy-gateway
  labels:
    app.kubernetes.io/component: proxy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
    interval: 30s
  namespaceSelector:
    matchNames:
    - envoy-gateway
