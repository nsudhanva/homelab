          "options": {
            "content": "### Privacy & Safety Architecture\n- **Strict Append-Only**: User emails are tagged exclusively via `addLabelIds`. Messages are **never** archived, removed from Inbox, or deleted.\n- **Zero PII Retention**: Message bodies, subjects, sender emails, and sensitive details are never written to observability storage or databases.\n- **Air-Gapped Local Inference**: All classifications run 100% locally on the in-cluster NVIDIA GeForce GTX 1050 Ti via Google Gemma 4 (E2B). Zero telemetry leaves your private network.\n- **Quarantine Safeguard**: Ambiguous or low-confidence (< 0.80) reachouts are safely quarantined under `ai-review` with daily Telegram digest dispatch.\n- **Zero External Overhead**: Telemetry is gathered seamlessly from Kubernetes Job metrics, cAdvisor, and NVIDIA DCGM without intrusive sidecars or heavy logging pipelines.",
