apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-health-fast
  namespace: monitoring
  labels:
    release: monitoring
    role: alert-rules
spec:
  groups:
  - name: pod.rules.fast
    rules:
    - alert: KubePodCrashLoopingFast
      expr: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics", reason="CrashLoopBackOff"}[2m]) >= 1
      for: 1m
      labels:
        severity: critical
      annotations:
        description: Pod {{ $labels.namespace }}/{{ $labels.pod }} (container {{ $labels.container }}) has been in CrashLoopBackOff for more than 1 minute.
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
    - alert: KubePodNotReadyFast
      expr: sum by (namespace, pod) (max by (namespace, pod) (kube_pod_status_phase{job="kube-state-metrics", phase=~"Pending|Unknown"} or (kube_pod_status_phase{job="kube-state-metrics", phase="Running"} == 1 and on (namespace, pod) kube_pod_status_ready{job="kube-state-metrics", condition="true"} == 0)) * on (namespace, pod) group_left() topk by (namespace, pod) (1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 1 minute.
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready
    - alert: KubeDeploymentReplicasMismatchFast
      expr: (kube_deployment_spec_replicas{job="kube-state-metrics"} > kube_deployment_status_replicas_available{job="kube-state-metrics"}) and (changes(kube_deployment_status_replicas_updated{job="kube-state-metrics"}[1m]) == 0)
      for: 1m
      labels:
        severity: warning
      annotations:
        description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than configured for more than 1 minute.
        summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch
