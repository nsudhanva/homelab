apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: git
    gitConfig:
      branch: master
  applicationRefs:
    - namePattern: app-headlamp
      images:
        - alias: headlamp
          imageName: ghcr.io/headlamp-k8s/headlamp:v0.45.0
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            pullSecret: secret:argocd/argocd-image-updater-registries#ghcr
    - namePattern: app-homer
      images:
        - alias: homer
          imageName: b4bz/homer:v26.08.3
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            pullSecret: secret:argocd/argocd-image-updater-registries#dockerhub
    - namePattern: app-filebrowser
      images:
        - alias: filebrowser
          imageName: docker.io/filebrowser/filebrowser:v2.32.0
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
            pullSecret: secret:argocd/argocd-image-updater-registries#dockerhub
    - namePattern: app-jellyfin
      images:
        - alias: jellyfin
          imageName: docker.io/jellyfin/jellyfin:latest
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: secret:argocd/argocd-image-updater-registries#dockerhub
