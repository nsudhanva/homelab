apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: git
    gitConfig:
      branch: master
  applicationRefs:
    - namePattern: app-headlamp
      images:
        - alias: headlamp
          imageName: ghcr.io/headlamp-k8s/headlamp
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    - namePattern: app-homer
      images:
        - alias: homer
          imageName: b4bz/homer
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    - namePattern: app-filebrowser
      images:
        - alias: filebrowser
          imageName: docker.io/filebrowser/filebrowser
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
    - namePattern: app-jellyfin
      images:
        - alias: jellyfin
          imageName: docker.io/jellyfin/jellyfin:latest
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: app-alert-summarizer
      images:
        - alias: alert-summarizer
          imageName: ghcr.io/nsudhanva/homelab-alert-summarizer:latest
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: app-docs
      images:
        - alias: docs
          imageName: ghcr.io/nsudhanva/homelab-docs:latest
          commonUpdateSettings:
            updateStrategy: digest
