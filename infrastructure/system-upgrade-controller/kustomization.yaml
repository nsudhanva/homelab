apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/crd.yaml
- https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.2/system-upgrade-controller.yaml
- k3s-upgrade-plan.yaml
patches:
- target:
    kind: ConfigMap
    name: default-controller-env
  patch: |-
    - op: replace
      path: /data/SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE
      value: rancher/kubectl:v1.36.2
- target:
    kind: Deployment
    name: system-upgrade-controller
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
