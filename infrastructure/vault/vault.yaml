apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    chart: vault
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 0.34.1
    helm:
      values: |
        global:
          tlsDisable: true
        injector:
          enabled: false
        csi:
          enabled: false
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                telemetry {
                  unauthenticated_metrics_access = "true"
                }
              }
              storage "file" {
                path = "/vault/data"
              }
              telemetry {
                prometheus_retention_time = "30s"
                disable_hostname = true
              }
          ha:
            enabled: false
          extraEnvironmentVars:
            VAULT_API_ADDR: "https://vault.sudhanva.me"
          dataStorage:
            enabled: true
            size: 20Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        ui:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
