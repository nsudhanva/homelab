apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-dns
  namespace: tailscale-dns
data:
  Corefile: |
    sudhanva.me:53 {
        errors
        health
        ready
        reload
        template IN A {
            match "^(actual|ai|alertmanager|argocd|bazarr|dns|docs|filebrowser|grafana|headlamp|home|homeassistant|homelab|jellyfin|prometheus|prowlarr|qbittorrent|radarr|seerr|sonarr|vault)[.]sudhanva[.]me[.]$"
            answer "{{ .Name }} 60 IN A 100.87.78.31"
            fallthrough
        }
        forward . 1.1.1.1 1.0.0.1
        cache 30
    }
