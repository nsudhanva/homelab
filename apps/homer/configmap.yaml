apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Homelab"
    subtitle: "sudhanva.me"
    icon: "fas fa-server"
    header: true
    columns: "3"
    defaults:
      layout: columns
      colorTheme: auto
    footer: false
    links:
      - name: "GitHub"
        icon: "fab fa-github"
        url: "https://github.com/nsudhanva/homelab"
        target: "_blank"
      - name: "Tailscale"
        icon: "fas fa-shield-alt"
        url: "https://login.tailscale.com/admin/machines"
        target: "_blank"
      - name: "Cloudflare"
        icon: "fas fa-cloud"
        url: "https://dash.cloudflare.com"
        target: "_blank"
      - name: "Telegram Bot"
        icon: "fab fa-telegram"
        url: "https://t.me/ManassuHomelabBot"
        target: "_blank"
    services:
      - name: "Media & Files"
        icon: "fas fa-film"
        items:
          - name: "Jellyfin"
            subtitle: "Media server with hardware NVENC"
            url: "https://jellyfin.sudhanva.me"
            icon: "fas fa-play-circle"
            tag: "media"
            target: "_blank"
          - name: "Filebrowser"
            subtitle: "Web file manager for storage"
            url: "https://filebrowser.sudhanva.me"
            icon: "fas fa-folder-open"
            tag: "media"
            target: "_blank"
      - name: "Smart Home & AI"
        icon: "fas fa-robot"
        items:
          - name: "Home Assistant"
            subtitle: "Smart home automation & IoT"
            url: "https://homeassistant.sudhanva.me"
            icon: "mdi:home-assistant"
            tag: "smarthome"
            target: "_blank"
          - name: "Gemma 4 AI"
            subtitle: "Local LLM inference on GTX 1050 Ti"
            url: "https://ai.sudhanva.me"
            icon: "fas fa-brain"
            tag: "ai"
            target: "_blank"
          - name: "Llama API"
            subtitle: "OpenAI-compatible models catalog"
            url: "https://ai.sudhanva.me/v1/models"
            icon: "fas fa-microchip"
            tag: "ai"
            target: "_blank"
      - name: "Cluster Management"
        icon: "fas fa-cogs"
        items:
          - name: "Argo CD"
            subtitle: "GitOps deployment & sync engine"
            url: "https://argocd.sudhanva.me"
            icon: "fas fa-code-branch"
            tag: "infra"
            target: "_blank"
          - name: "Headlamp"
            subtitle: "Kubernetes cluster administration UI"
            url: "https://headlamp.sudhanva.me"
            icon: "fas fa-sitemap"
            tag: "infra"
            target: "_blank"
          - name: "HashiCorp Vault"
            subtitle: "Secrets management & PKI engine"
            url: "https://vault.sudhanva.me"
            icon: "fas fa-lock"
            tag: "infra"
            target: "_blank"
          - name: "Technitium DNS"
            subtitle: "Authoritative & recursive DNS server"
            url: "https://dns.sudhanva.me"
            icon: "fas fa-network-wired"
            tag: "infra"
            target: "_blank"
      - name: "Observability & Metrics"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            subtitle: "Metrics visualization portal"
            url: "https://grafana.sudhanva.me"
            icon: "fas fa-chart-area"
            tag: "monitoring"
            target: "_blank"
          - name: "Prometheus"
            subtitle: "PromQL metrics query engine"
            url: "https://prometheus.sudhanva.me/graph"
            icon: "fas fa-wave-square"
            tag: "monitoring"
            target: "_blank"
          - name: "Prometheus Targets"
            subtitle: "Scrape targets health & discovery"
            url: "https://prometheus.sudhanva.me/targets"
            icon: "fas fa-bullseye"
            tag: "monitoring"
            target: "_blank"
          - name: "Alertmanager"
            subtitle: "Alert routing & Telegram dispatch"
            url: "https://alertmanager.sudhanva.me"
            icon: "fas fa-bell"
            tag: "monitoring"
            target: "_blank"
          - name: "Prometheus Alerts"
            subtitle: "Active firing alert rules"
            url: "https://prometheus.sudhanva.me/alerts"
            icon: "fas fa-exclamation-triangle"
            tag: "monitoring"
            target: "_blank"
      - name: "Grafana Dashboards"
        icon: "fas fa-tachometer-alt"
        items:
          - name: "NVIDIA GPU DCGM"
            subtitle: "GTX 1050 Ti VRAM & thermals"
            url: "https://grafana.sudhanva.me/d/nvidia-dcgm/nvidia-dcgm-exporter-dashboard"
            icon: "fas fa-desktop"
            tag: "dashboards"
            target: "_blank"
          - name: "Kubernetes Cluster"
            subtitle: "Compute resources & node capacity"
            url: "https://grafana.sudhanva.me/d/efa86fd1d0c121a26444b636a3f509a8/kubernetes-compute-resources-cluster"
            icon: "fas fa-server"
            tag: "dashboards"
            target: "_blank"
          - name: "Envoy Gateway"
            subtitle: "Ingress RPS, latency & HTTP routes"
            url: "https://grafana.sudhanva.me/d/envoy-gateway/envoy-gateway-overview"
            icon: "fas fa-exchange-alt"
            tag: "dashboards"
            target: "_blank"
          - name: "Cert-Manager"
            subtitle: "Let's Encrypt certificate validity"
            url: "https://grafana.sudhanva.me/d/cert-manager/cert-manager"
            icon: "fas fa-certificate"
            tag: "dashboards"
            target: "_blank"
          - name: "ArgoCD Operations"
            subtitle: "Application health & sync latency"
            url: "https://grafana.sudhanva.me/d/argocd/argocd"
            icon: "fas fa-tasks"
            tag: "dashboards"
            target: "_blank"
          - name: "Vault Health"
            subtitle: "Tokens, leases & secret operations"
            url: "https://grafana.sudhanva.me/d/hashicorp-vault/hashicorp-vault"
            icon: "fas fa-shield-alt"
            tag: "dashboards"
            target: "_blank"
          - name: "Gmail Classifier"
            subtitle: "SLM triage & inference metrics"
            url: "https://grafana.sudhanva.me/d/gmail-classifier-ops/gmail-classifier-and-slm-operations"
            icon: "fas fa-envelope-open-text"
            tag: "dashboards"
            target: "_blank"
      - name: "Documentation"
        icon: "fas fa-book"
        items:
          - name: "Homelab Docs"
            subtitle: "Astro Starlight knowledge base"
            url: "https://homelab.sudhanva.me"
            icon: "fas fa-book-open"
            tag: "docs"
            target: "_blank"
          - name: "Tutorials"
            subtitle: "Bare-metal K3s installation guides"
            url: "https://homelab.sudhanva.me/tutorials/"
            icon: "fas fa-graduation-cap"
            tag: "docs"
            target: "_blank"
          - name: "Monitoring How-To"
            subtitle: "Prometheus, Alertmanager & Telegram"
            url: "https://homelab.sudhanva.me/how-to/monitoring/"
            icon: "fas fa-stethoscope"
            tag: "docs"
            target: "_blank"
          - name: "Version Matrix"
            subtitle: "Component releases & dependency catalog"
            url: "https://homelab.sudhanva.me/reference/versions/"
            icon: "fas fa-list-ol"
            tag: "docs"
            target: "_blank"
          - name: "Operations Checklist"
            subtitle: "Health checks & maintenance procedures"
            url: "https://homelab.sudhanva.me/reference/operations-checklist/"
            icon: "fas fa-clipboard-check"
            tag: "docs"
            target: "_blank"
