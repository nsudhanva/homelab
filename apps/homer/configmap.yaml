        icon: "fab fa-github"
        url: "https://github.com/nsudhanva/homelab"
        target: "_blank"
      - name: "Tailscale"
        icon: "fas fa-shield-alt"
        url: "https://login.tailscale.com/admin/machines"
        target: "_blank"
      - name: "Cloudflare"
        icon: "fas fa-cloud"
        url: "https://dash.cloudflare.com"
        target: "_blank"
      - name: "Bitwarden"
        icon: "fas fa-key"
        url: "https://vault.bitwarden.com"
        target: "_blank"
      - name: "Telegram Bot"
        icon: "fab fa-telegram"
        url: "https://t.me/ManassuHomelabBot"
        target: "_blank"
