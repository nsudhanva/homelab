apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Home"
    subtitle: "sudhanva.me"
    icon: "fas fa-server"
    header: true
    columns: "3"
    defaults:
      layout: columns
      colorTheme: auto
    footer: false
    services:
      - name: "Media"
        icon: "fas fa-film"
        items:
          - name: "Jellyfin"
            subtitle: "Media server"
            url: "https://jellyfin.sudhanva.me"
            icon: "fas fa-play-circle"
            tag: "media"
            target: "_blank"
          - name: "Filebrowser"
            subtitle: "Media files"
            url: "https://filebrowser.sudhanva.me"
            icon: "fas fa-folder-open"
            tag: "media"
            target: "_blank"
      - name: "Smart Home"
        icon: "fas fa-home"
        items:
          - name: "Home Assistant"
            subtitle: "Home automation"
            url: "https://homeassistant.sudhanva.me"
            icon: "mdi:home-assistant"
            tag: "smarthome"
            target: "_blank"
      - name: "AI & Automation"
        icon: "fas fa-brain"
        items:
          - name: "Gemma 4 AI"
            subtitle: "Local LLM on GPU"
            url: "https://ai.sudhanva.me"
            icon: "fas fa-robot"
            tag: "ai"
            target: "_blank"
      - name: "Docs"
        icon: "fas fa-book"
        items:
          - name: "Homelab Docs"
            subtitle: "Notes and guides"
            url: "https://docs.sudhanva.me"
            icon: "fas fa-book-open"
            tag: "docs"
            target: "_blank"
      - name: "Management"
        icon: "fas fa-cogs"
        items:
          - name: "Argo CD"
            subtitle: "GitOps controller"
            url: "https://argocd.sudhanva.me"
            icon: "fas fa-code-branch"
            tag: "infra"
            target: "_blank"
          - name: "Vault"
            subtitle: "Secrets"
            url: "https://vault.sudhanva.me"
            icon: "fas fa-lock"
            tag: "infra"
            target: "_blank"
          - name: "Headlamp"
            subtitle: "Kubernetes UI"
            url: "https://headlamp.sudhanva.me"
            icon: "fas fa-sitemap"
            tag: "infra"
            target: "_blank"
      - name: "Network"
        icon: "fas fa-network-wired"
        items:
          - name: "Technitium"
            subtitle: "DNS Server"
            url: "https://dns.sudhanva.me"
            icon: "fas fa-globe"
            tag: "infra"
            target: "_blank"
      - name: "Observability"
        icon: "fas fa-chart-line"
        items:
          - name: "Grafana"
            subtitle: "Dashboards"
            url: "https://grafana.sudhanva.me"
            icon: "fas fa-chart-area"
            tag: "infra"
            target: "_blank"
          - name: "Prometheus"
            subtitle: "Metrics"
            url: "https://prometheus.sudhanva.me"
            icon: "fas fa-wave-square"
            tag: "infra"
            target: "_blank"
          - name: "Alertmanager"
            subtitle: "Alert routing"
            url: "https://alertmanager.sudhanva.me"
            icon: "fas fa-bell"
            tag: "infra"
            target: "_blank"
