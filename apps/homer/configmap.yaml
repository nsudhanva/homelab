apiVersion: v1
kind: ConfigMap
metadata:
  name: homer-config
  namespace: homer
data:
  config.yml: |
    title: "Homelab"
    subtitle: "sudhanva.me"
    icon: "fas fa-server"
    header: true
    columns: "3"
    defaults:
      layout: columns
      colorTheme: auto
    footer: false
