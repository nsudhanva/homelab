apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.1
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: PORT
              value: "5055"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 1024Mi
              cpu: 500m
          volumeMounts:
            - name: config
              mountPath: /app/config
          ports:
            - containerPort: 5055
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
