apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sarvam-api
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sarvam-api
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: sarvam
        property: api_key
