apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.3
          ports:
            - containerPort: 8123
              name: http
          env:
            - name: SARVAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sarvam-api
                  key: api_key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: core-config
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
            - name: packages
              mountPath: /config/packages
            - name: sarvam-tts
              mountPath: /config/custom_components/sarvam_tts
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: core-config
          configMap:
            name: home-assistant-core-config
        - name: packages
          configMap:
            name: home-assistant-packages
        - name: sarvam-tts
          configMap:
            name: home-assistant-sarvam-tts
