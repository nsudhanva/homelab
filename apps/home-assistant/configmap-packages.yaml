apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-packages
  namespace: home-assistant
data:
  general.yaml: |
    input_boolean:
      gaming_mode:
        name: Gaming Mode
        icon: mdi:gamepad-variant
  sarvam.yaml: |
    tts:
      - platform: sarvam_tts
        api_key: !env_var SARVAM_API_KEY
        language: kn-IN
        model: bulbul:v4-flash
        speaker: chaitra_kn_conversation

    script:
      say_kannada:
        alias: Say in Kannada
        icon: mdi:account-voice
        fields:
          message:
            name: Message
            description: Kannada text to speak, in Kannada script.
            required: true
            example: ನಮಸ್ಕಾರ
            selector:
              text:
                multiline: true
          speaker:
            name: Speaker
            description: Media player that plays the message.
            default: media_player.living_room_speaker
            selector:
              entity:
                domain: media_player
        sequence:
          - action: tts.sarvam_tts_say
            data:
              entity_id: "{{ speaker | default('media_player.living_room_speaker') }}"
              message: "{{ message }}"
