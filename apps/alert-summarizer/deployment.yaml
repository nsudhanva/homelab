apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-summarizer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-summarizer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-summarizer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-summarizer
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-summarizer
          image: ghcr.io/nsudhanva/homelab-alert-summarizer:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: homelab-ai
            - secretRef:
                name: homelab-ai-credentials
          env:
            - name: ALERT_TELEGRAM_CHAT_ID
              value: "7341944813"
            - name: ALERT_TELEGRAM_BOT_TOKEN_FILE
              value: "/etc/secrets/token"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: telegram-token
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: telegram-token
          secret:
            secretName: alertmanager-telegram
