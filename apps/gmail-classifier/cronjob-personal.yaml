apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmail-classifier-personal
  namespace: gmail-classifier
spec:
  schedule: "0 1 * * *"
  timeZone: America/Los_Angeles
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: gmail-classifier-personal
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gmail-classifier
              image: ghcr.io/nsudhanva/homelab-gmail-classifier:latest
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              envFrom:
                - configMapRef:
                    name: homelab-ai
                - secretRef:
                    name: homelab-ai-credentials
                - secretRef:
                    name: gmail-credentials-personal
              env:
                - name: ACCOUNT_NAME
                  value: "personal"
                - name: TELEGRAM_CHAT_ID
                  value: "7341944813"
                - name: CONFIDENCE_THRESHOLD
                  value: "0.80"
                - name: QUARANTINE_LABEL
                  value: "ai-review"
                - name: PROCESSED_LABEL
                  value: "ai-processed"
                - name: CONCURRENCY
                  value: "4"
                - name: ARCHIVE_OLDER_THAN_DAYS
                  value: "90"
                - name: AUTO_ARCHIVE_ENABLED
                  value: "true"
                - name: ALLOW_LABEL_CREATION
                  value: "true"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
