apiVersion: batch/v1
kind: Job
metadata:
  name: gmail-classifier-inbox-secondary
  namespace: gmail-classifier
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: gmail-classifier-secondary
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gmail-classifier
          image: ghcr.io/nsudhanva/homelab-gmail-classifier:latest
          imagePullPolicy: Always
          args:
            - --inbox
            - --concurrency
            - "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          envFrom:
            - secretRef:
                name: gmail-credentials-secondary
            - secretRef:
                name: openrouter-credentials
                optional: true
          env:
            - name: ACCOUNT_NAME
              value: "secondary"
            - name: PRIMARY_LLM_PROVIDER
              value: "local"
            - name: FALLBACK_LLM_PROVIDER
              value: "openrouter"
            - name: LLM_BASE_URL
              value: "http://llama-server.llama.svc.cluster.local:8080/v1"
            - name: TELEGRAM_CHAT_ID
              value: "7341944813"
            - name: CONFIDENCE_THRESHOLD
              value: "0.80"
            - name: QUARANTINE_LABEL
              value: "ai-review"
            - name: PROCESSED_LABEL
              value: "ai-processed"
            - name: ARCHIVE_OLDER_THAN_DAYS
              value: "90"
            - name: AUTO_ARCHIVE_ENABLED
              value: "true"
            - name: ALLOW_LABEL_CREATION
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
