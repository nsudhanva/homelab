apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmail-classifier
  namespace: gmail-classifier
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: gmail-classifier
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gmail-classifier
              image: ghcr.io/nsudhanva/homelab-gmail-classifier:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              envFrom:
                - secretRef:
                    name: gmail-credentials
              env:
                - name: LLM_BASE_URL
                  value: "http://llama-server.llama.svc.cluster.local:8080/v1"
                - name: TELEGRAM_CHAT_ID
                  value: "7341944813"
                - name: CONFIDENCE_THRESHOLD
                  value: "0.80"
                - name: QUARANTINE_LABEL
                  value: "ai-review"
                - name: PROCESSED_LABEL
                  value: "ai-processed"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
