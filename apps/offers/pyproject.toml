[project]
name = "offers"
version = "0.1.0"
description = "Tracks credit card and subscription offers against Actual Budget transactions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "actualpy>=0.22.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
    "homelab-ai",
]

[project.scripts]
offers = "offers.cli:main"

[tool.uv.sources]
homelab-ai = { path = "../../packages/homelab-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.8",
    "ty>=0.0.81",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["offers"]

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
