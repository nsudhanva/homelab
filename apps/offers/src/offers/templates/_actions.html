{% macro actions(r) %}
<form method="post" action="/override" class="actions">
  <input type="hidden" name="offer_id" value="{{ r.instance.offer.id }}">
  <input type="hidden" name="account_id" value="{{ r.instance.account.id }}">
  <input type="hidden" name="period_start" value="{{ r.window.start.isoformat() }}">
  {% if r.override %}
    <button name="status" value="clear">Undo</button>
  {% else %}
    <button name="status" value="used">{{ "Activated" if r.instance.offer.kind.value == "activation" else "Mark used" }}</button>
    <button name="status" value="ignored">Skip</button>
  {% endif %}
</form>
{% endmacro %}
