apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offers-secrets
  namespace: offers
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: offers-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACTUAL_PASSWORD
      remoteRef:
        key: actual
        property: password
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram/bot
        property: token
