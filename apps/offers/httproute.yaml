apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offers
  namespace: offers
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
      sectionName: https
  hostnames:
    - offers.sudhanva.me
  rules:
    - backendRefs:
        - name: offers
          port: 80
