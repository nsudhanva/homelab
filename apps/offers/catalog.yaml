ignore_accounts: checking|savings|hysa|debit|brokerage|\bira\b|crypto|stock plan|individual|joint

merchant_rules:
  online_retail: \bamazon\b(?!.*(fresh|web services))|audible
  groceries: whole foods|amazon fresh|safeway|trader joe|wegmans|costco|farmers market|mandi|grocer
  rideshare: \buber\b(?!.*eats)|\blyft\b|waymo
  transit: \bmta\b|omny|clipper|\bmbta\b|\bbart\b|caltrain|metro|pay ?by ?phone|parking
  gas: chevron|shell|speedway|exxon|mobil|\barco\b|\b76\b|world oil|valero
  drugstore: walgreens|cvs|duane reade|rite aid
  streaming: netflix|disney\+|hulu|paramount|spotify|fox one|youtube premium|max\b
  phone: t-mobile|verizon|at&t

cards:
  - id: amex-gold
    name: American Express Gold Card
    issuer: American Express
    annual_fee: 325
    account: amex gold
    fee_payee: membership fee|annual fee
    rewards:
      currency: points
      program: Membership Rewards
      point_value: 0.6
      base: 1
      note: >-
        Points at 0.6 cents each, their value as a statement credit. They are worth 1 cent on
        flights through Amex Travel, and more through airline and hotel transfer partners.
      bonuses:
        - name: Restaurants
          rate: 4
          types: [dining]
          cap: {amount: 50000, period: year, after_rate: 1}
        - name: U.S. supermarkets
          rate: 4
          types: [groceries]
          cap: {amount: 25000, period: year, after_rate: 1}
          note: superstores, warehouse clubs, and convenience stores do not count
        - name: Flights
          rate: 3
          types: [airline]
          note: booked directly with the airline or on Amex Travel
        - name: Prepaid hotels on Amex Travel
          rate: 5
          payee: amex travel|american express travel
          note: prepaid car rentals and Airbnb stays on Amex Travel earn 2x, which bank data cannot separate

  - id: chase-sapphire-reserve
    name: Chase Sapphire Reserve
    issuer: Chase
    annual_fee: 795
    account: sapphire reserve
    fee_payee: annual (membership )?fee
    anniversary_month: 7
    rewards:
      currency: points
      program: Ultimate Rewards
      point_value: 1.0
      base: 1
      note: >-
        Points at 1 cent each, their cash value. Points Boost on Chase Travel can make some
        redemptions worth up to 2 cents.
      bonuses:
        - name: Chase Travel
          rate: 8
          payee: chase travel
        - name: Flights and hotels booked direct
          rate: 4
          types: [airline, hotel]
        - name: Dining
          rate: 3
          types: [dining]
        - name: Lyft
          rate: 5
          payee: \blyft\b
          valid_to: 2027-09-30

  - id: chase-freedom-flex
    name: Chase Freedom Flex
    issuer: Chase
    account: freedom flex
    rewards:
      base: 1
      bonuses:
        - name: 5% categories (Q3 2026)
          rate: 5
          types: [gas, transit, entertainment]
          payee: united way
          cap: {amount: 1500, period: quarter, after_rate: 1}
          valid_from: 2026-07-01
          valid_to: 2026-09-30
          activation_offer: freedom-flex-5-percent
          note: gas and EV charging, public transit, live entertainment, United Way
        - name: 5% categories (Q4 2026)
          rate: 5
          types: [groceries, dining]
          payee: red cross
          cap: {amount: 1500, period: quarter, after_rate: 1}
          valid_from: 2026-10-01
          valid_to: 2026-12-31
          activation_offer: freedom-flex-5-percent
          note: grocery stores (not Walmart or Target), dining, American Red Cross
        - name: Chase Travel
          rate: 5
          payee: chase travel
        - name: Dining
          rate: 3
          types: [dining]
        - name: Drugstores
          rate: 3
          types: [drugstore]
        - name: Lyft
          rate: 2
          payee: \blyft\b
          valid_to: 2027-09-30

  - id: discover-it
    name: Discover it Cash Back
    issuer: Discover
    account: discover it card
    rewards:
      base: 1
      note: In the first year, Discover matches all the cash back at the end of the year.
      bonuses:
        - name: 5% categories (Q3 2026)
          rate: 5
          types: [gas, transit, airline, drugstore]
          cap: {amount: 1500, period: quarter, after_rate: 1}
          valid_from: 2026-07-01
          valid_to: 2026-09-30
          activation_offer: discover-it-5-percent
          note: gas and EV charging, transportation, drugstores
        - name: 5% categories (Q4 2026)
          rate: 5
          types: [dining, entertainment, utilities]
          cap: {amount: 1500, period: quarter, after_rate: 1}
          valid_from: 2026-10-01
          valid_to: 2026-12-31
          activation_offer: discover-it-5-percent
          note: restaurants, entertainment, utilities

  - id: apple-card
    name: Apple Card
    issuer: Apple
    account: apple card
    rewards:
      base: 2
      note: >-
        Assumes Apple Pay, which earns 2%. The physical card earns 1%. Bank data does not show
        which one paid, and the 3% partner rate also needs Apple Pay.
      bonuses:
        - name: Apple
          rate: 3
          payee: \bapple\b|app store|itunes
        - name: Apple Pay partners
          rate: 3
          payee: ace hardware|booking\.com|chargepoint|duane reade|exxon|\bmobil\b|hertz|\bnike\b|\buber\b|walgreens

  - id: robinhood-gold-card
    name: Robinhood Gold Card
    issuer: Robinhood
    account: robinhood credit card
    rewards:
      currency: points
      program: Robinhood points
      point_value: 1.0
      base: 3
      note: >-
        3 points on everything with an active Robinhood Gold membership. Points are worth
        1 cent moved to brokerage cash, and less as a statement credit.

  - id: prime-visa
    name: Amazon Prime Visa
    issuer: Chase
    account: prime visa
    rewards:
      base: 1
      note: The 5% rates need a Prime membership. Checkout promotions on Amazon are not visible.
      bonuses:
        - name: Amazon, Whole Foods, and Audible
          rate: 5
          payee: \bamazon\b(?!.*web services)|whole foods|audible
        - name: Chase Travel
          rate: 5
          payee: chase travel
        - name: Gas, restaurants, and local transit
          rate: 2
          types: [gas, dining, transit, rideshare]

offers:
  - id: amex-gold-uber-cash
    card: amex-gold
    name: Uber Cash
    value: 10
    period: monthly
    how_to_use: >-
      Uber Cash loads into the Uber app each month while the Gold Card is a payment method
      there. It applies only to rides and Uber Eats orders in the U.S. that an Amex card pays
      for. A trip that Uber Cash pays in full does not show in Actual, so mark that month as
      used.
    detect:
      usage:
        payee: \buber\b(?![\W_]*one\b)

  - id: amex-gold-dining
    card: amex-gold
    name: Dining credit
    value: 10
    period: monthly
    enrollment: true
    how_to_use: >-
      Pay with the Gold Card at Grubhub, Seamless, The Cheesecake Factory, Five Guys,
      Buffalo Wild Wings, or Wonder.
    detect:
      credit:
        payee: grubhub|seamless|cheesecake|five guys|buffalo wild wings|\bwonder\b|dining credit
        max_amount: 10
      usage:
        payee: grubhub|seamless|cheesecake|five guys|buffalo wild wings|\bwonder\b
      keywords: [grubhub, seamless, cheesecake, five guys, buffalo wild wings, bww, wonder]
      ai_hint: >-
        Eligible merchants in the U.S.: Grubhub (including Seamless), The Cheesecake Factory,
        Five Guys, Buffalo Wild Wings, and Wonder. Other restaurants do not count.

  - id: amex-gold-dunkin
    card: amex-gold
    name: Dunkin' credit
    value: 7
    period: monthly
    enrollment: true
    how_to_use: Pay with the Gold Card at a U.S. Dunkin' location or in the Dunkin' app.
    detect:
      credit:
        payee: dunkin
        max_amount: 7
      usage:
        payee: dunkin

  - id: amex-gold-resy
    card: amex-gold
    name: Resy credit
    value: 50
    period: semiannual
    enrollment: true
    how_to_use: >-
      Pay with the Gold Card at a U.S. restaurant on Resy, or for an eligible Resy purchase.
      January to June, and July to December.
    detect:
      credit:
        payee: \bresy\b

  - id: amex-offer-paramount-plus
    card: amex-gold
    name: "Amex Offer: Paramount+"
    value: 41.97
    period: annual
    uses: 3
    valid_from: 2026-05-06
    valid_to: 2026-10-19
    enrollment: true
    how_to_use: >-
      An Amex Offer added to the Gold Card. Spend $13.99 or more at Paramount+ and get $13.99
      back, up to 3 times ($41.97). Amex Offers are targeted, so check the Amex app for a new
      round.
    detect:
      credit:
        payee: paramount
        max_amount: 13.99
      usage:
        payee: paramount
        min_amount: 13.99

  - id: csr-travel
    card: chase-sapphire-reserve
    name: Travel credit
    value: 300
    period: cardmember_year
    how_to_use: Chase applies it automatically to the first travel purchases of each card-member year.
    detect:
      credit:
        payee: travel credit

  - id: csr-the-edit
    card: chase-sapphire-reserve
    name: The Edit hotel credit
    value: 500
    period: annual
    valid_from: 2026-01-01
    how_to_use: >-
      Two credits of $250 for prepaid stays of two nights or more booked through The Edit
      by Chase Travel.
    detect:
      credit:
        payee: the edit|edit credit
      keywords: [the edit]
      ai_hint: A statement credit from Chase for a hotel stay booked through The Edit by Chase Travel.

  - id: csr-chase-travel-hotel
    card: chase-sapphire-reserve
    name: Chase Travel hotel credit
    value: 250
    period: annual
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    how_to_use: >-
      Book a prepaid stay of two nights or more at a select hotel brand through Chase Travel.
    detect:
      credit:
        payee: hotel credit
      keywords: [hotel]
      ai_hint: A statement credit from Chase for a select hotel booked through Chase Travel in 2026.

  - id: csr-dining
    card: chase-sapphire-reserve
    name: Exclusive Tables dining credit
    value: 150
    period: semiannual
    valid_to: 2030-06-30
    how_to_use: >-
      Pay with the Sapphire Reserve at a Sapphire Reserve Exclusive Tables restaurant. Find
      the restaurants on OpenTable. January to June, and July to December.
    detect:
      credit:
        payee: dining credit|exclusive tables
      keywords: [dining, opentable]
      ai_hint: A statement credit from Chase for a Sapphire Reserve Exclusive Tables restaurant.

  - id: csr-stubhub
    card: chase-sapphire-reserve
    name: StubHub credit
    value: 150
    period: semiannual
    valid_to: 2027-12-31
    enrollment: true
    how_to_use: Activate it in the Chase app, then buy tickets on StubHub or viagogo.
    detect:
      credit:
        payee: stubhub|viagogo
        max_amount: 150
      usage:
        payee: stubhub|viagogo

  - id: csr-peloton
    card: chase-sapphire-reserve
    name: Peloton credit
    value: 10
    period: monthly
    valid_to: 2027-12-31
    enrollment: true
    how_to_use: Activate it in the Chase app, then pay for a Peloton membership with the card.
    detect:
      credit:
        payee: peloton
        max_amount: 10
      usage:
        payee: peloton

  - id: csr-lyft
    card: chase-sapphire-reserve
    name: Lyft credit
    value: 10
    period: monthly
    valid_to: 2027-09-30
    how_to_use: The credit is in the Lyft app. Use it on a ride paid with the Sapphire Reserve.
    detect:
      usage:
        payee: \blyft\b

  - id: csr-doordash
    card: chase-sapphire-reserve
    name: DoorDash credits
    period: monthly
    valid_to: 2026-09-30
    how_to_use: >-
      In-app promos in the DoorDash account with DashPass, applied to orders paid with the
      card: $5 off one restaurant order and $10 off each of two store orders, every month.
    promos:
      - name: Store promo
        value: 10
        payee: via doordash|dashmart
      - name: Store promo
        value: 10
        payee: via doordash|dashmart
      - name: Restaurant promo
        value: 5
        payee: ^doordash$
    detect:
      usage:
        payee: doordash|dashmart

  - id: csr-doordash-2026-10
    card: chase-sapphire-reserve
    name: DoorDash credits
    period: monthly
    valid_from: 2026-10-01
    valid_to: 2029-12-31
    how_to_use: >-
      In-app promos in the DoorDash account with DashPass, applied to orders paid with the
      card: $15 off one order and $10 off each of two store orders, every month.
    promos:
      - name: Store promo
        value: 10
        payee: via doordash|dashmart
      - name: Store promo
        value: 10
        payee: via doordash|dashmart
      - name: Order promo
        value: 15
    detect:
      usage:
        payee: doordash|dashmart

  - id: csr-apple-subscriptions
    card: chase-sapphire-reserve
    name: Apple TV and Apple Music
    kind: activation
    period: once
    valid_from: 2026-01-01
    valid_to: 2027-06-22
    enrollment: true
    how_to_use: >-
      The card includes Apple TV and Apple Music. Activate them in the Chase app by
      2027-06-22, and cancel any paid Apple TV or Apple Music subscription.

  - id: csr-dashpass
    card: chase-sapphire-reserve
    name: DashPass
    kind: activation
    period: once
    valid_from: 2026-01-01
    valid_to: 2029-12-31
    enrollment: true
    how_to_use: >-
      The card includes DashPass. Activate it in the DoorDash app with the card. The DoorDash
      promos need it.

  - id: freedom-flex-5-percent
    card: chase-freedom-flex
    name: Activate the 5% categories
    kind: activation
    period: quarterly
    enrollment: true
    how_to_use: Activate this quarter's 5% categories in the Chase app.

  - id: discover-it-5-percent
    card: discover-it
    name: Activate the 5% categories
    kind: activation
    period: quarterly
    enrollment: true
    how_to_use: Activate this quarter's 5% Cashback Bonus categories in the Discover app.
