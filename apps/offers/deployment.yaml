apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers
  namespace: offers
  labels:
    app.kubernetes.io/name: offers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: offers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: offers
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: offers
          image: ghcr.io/nsudhanva/homelab-offers:latest
          imagePullPolicy: Always
          args:
            - serve
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: OFFERS_DB_PATH
              value: /data/offers.db
            - name: OFFERS_CATALOG_PATH
              value: /config/catalog.yaml
            - name: OFFERS_TIMEZONE
              value: America/Los_Angeles
            - name: OFFERS_PUBLIC_URL
              value: https://offers.sudhanva.me
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: catalog
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: offers-data
        - name: catalog
          configMap:
            name: offers-catalog
        - name: tmp
          emptyDir: {}
