[project]
name = "actual-classifier"
version = "0.1.0"
description = "AI-powered transaction classifier and tagger for Actual Budget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "actualpy>=0.22.0",
    "homelab-ai",
]

[tool.uv.sources]
homelab-ai = { path = "../../packages/homelab-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actual_classifier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["actual_classifier", "homelab_ai"]

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
