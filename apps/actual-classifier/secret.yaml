apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-classifier-secrets
  namespace: actual-classifier
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: actual-classifier-secrets
    creationPolicy: Owner
  data:
    - secretKey: ACTUAL_PASSWORD
      remoteRef:
        key: actual
        property: password
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter
        property: api_key
