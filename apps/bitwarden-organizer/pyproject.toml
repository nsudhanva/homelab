[project]
name = "bitwarden-organizer"
version = "0.1.0"
description = "Daily AI job that files Bitwarden items without a folder into the existing folders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "homelab-ai",
]

[tool.uv.sources]
homelab-ai = { path = "../../packages/homelab-ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pydantic-ai>=2.63.0",
    "pytest>=8.3.0",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["bitwarden_organizer"]

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
