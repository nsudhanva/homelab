[project]
name = "drive-organizer"
version = "0.1.0"
description = "Symmetrical Google Drive intelligent file organizer powered by local SLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=2.43.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "homelab-ai",
]

[tool.uv.sources]
homelab-ai = { path = "../../packages/homelab-ai", editable = true }

[project.scripts]
drive-organizer = "drive_organizer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
