apiVersion: batch/v1
kind: CronJob
metadata:
  name: drive-organizer-tertiary
  namespace: drive-organizer
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 5
      template:
        metadata:
          labels:
            app: drive-organizer-tertiary
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: drive-organizer
            image: ghcr.io/nsudhanva/homelab-drive-organizer:latest
            imagePullPolicy: Always
            args:
            - "--scope=root"
            envFrom:
            - secretRef:
                name: drive-credentials-tertiary
            - secretRef:
                name: openrouter-credentials
                optional: true
            env:
            - name: ACCOUNT_NAME
              value: "tertiary"
            - name: PRIMARY_LLM_PROVIDER
              value: "local"
            - name: FALLBACK_LLM_PROVIDER
              value: "openrouter"
            - name: LLM_BASE_URL
              value: "http://llama-server.llama.svc.cluster.local:8080/v1"
            - name: LLM_MODEL_NAME
              value: "gemma-4-e2b-it"
            - name: TELEGRAM_CHAT_ID
              value: "7341944813"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
