apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jobs
  namespace: jobs
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
      sectionName: https
  hostnames:
    - jobs.sudhanva.me
  rules:
    - backendRefs:
        - name: jobs
          port: 80
