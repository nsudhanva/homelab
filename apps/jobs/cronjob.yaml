apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobs-sync
  namespace: jobs
spec:
  schedule: "0 5 * * *"
  timeZone: America/Los_Angeles
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jobs-sync
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: jobs-sync
              image: ghcr.io/nsudhanva/homelab-jobs:latest
              imagePullPolicy: Always
              args:
                - sync
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - configMapRef:
                    name: homelab-ai
                - secretRef:
                    name: homelab-ai-credentials
                - secretRef:
                    name: jobs-secrets
              env:
                - name: AI_FALLBACK_MODELS
                  value: none
                - name: JOBS_DB_PATH
                  value: /data/jobs.db
                - name: JOBS_WORKERS
                  value: "4"
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jobs-data
            - name: tmp
              emptyDir: {}
