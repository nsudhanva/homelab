apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: qbittorrent-vpn
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: qbittorrent/vpn
        property: private_key
    - secretKey: public_key
      remoteRef:
        key: qbittorrent/vpn
        property: public_key
    - secretKey: endpoint_ip
      remoteRef:
        key: qbittorrent/vpn
        property: endpoint_ip
    - secretKey: endpoint_port
      remoteRef:
        key: qbittorrent/vpn
        property: endpoint_port
    - secretKey: addresses
      remoteRef:
        key: qbittorrent/vpn
        property: addresses
