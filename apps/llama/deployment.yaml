apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llama
  labels:
    app: llama-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-model
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              set -e
              MODEL_FILE="/models/google_gemma-4-E2B-it-Q4_K_M.gguf"
              if [ ! -s "$MODEL_FILE" ]; then
                echo "Downloading Google Gemma 4 E2B Q4_K_M..."
                curl -f -L -o "$MODEL_FILE.tmp" "https://huggingface.co/bartowski/google_gemma-4-E2B-it-GGUF/resolve/main/google_gemma-4-E2B-it-Q4_K_M.gguf"
                mv "$MODEL_FILE.tmp" "$MODEL_FILE"
                echo "Model downloaded successfully."
              else
                echo "Model already present on disk."
              fi
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --model
            - /models/google_gemma-4-E2B-it-Q4_K_M.gguf
            - --alias
            - gemma-4-e2b-it
            - --n-gpu-layers
            - "99"
            - --ctx-size
            - "4096"
            - --parallel
            - "1"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 3000m
              memory: 5Gi
              nvidia.com/gpu: "1"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
