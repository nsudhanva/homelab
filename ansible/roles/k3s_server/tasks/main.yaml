- name: Ensure k3s configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s/agent/etc/containerd

- name: Deploy k3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  notify: Restart k3s


- name: Check if k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install or update k3s
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server
  when: not k3s_binary.stat.exists

- name: Ensure k3s service is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for Kubernetes API to respond
  ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  until: k3s_nodes.rc == 0
  retries: 20
  delay: 5
  changed_when: false

- name: Fetch kubeconfig to local machine
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ kubeconfig_local_dest }}"
    flat: true

- name: Update server address in local kubeconfig
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_dest }}"
    regexp: "https://[^:]+:6443"
    replace: "https://{{ ansible_host }}:6443"
