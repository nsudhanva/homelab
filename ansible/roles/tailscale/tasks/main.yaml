- name: Check that Tailscale is installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary

- name: Require Tailscale on cluster nodes
  ansible.builtin.assert:
    that: tailscale_binary.stat.exists
    fail_msg: "Install Tailscale and run 'sudo tailscale up' on {{ inventory_hostname }} before provisioning"

- name: Read Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Disable Tailscale DNS so nodes do not resolve through in-cluster DNS
  ansible.builtin.command: tailscale set --accept-dns=false
  when: (tailscale_prefs.stdout | from_json).CorpDNS
  changed_when: true

- name: Wait for the Tailscale node IP
  ansible.builtin.command: ip -4 -o addr show dev tailscale0
  register: tailscale_addr
  until: k3s_node_ip in tailscale_addr.stdout
  retries: 30
  delay: 2
  changed_when: false
  check_mode: false
