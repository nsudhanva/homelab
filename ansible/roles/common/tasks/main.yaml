- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - jq
      - nfs-common
      - iptables
      - power-profiles-daemon
    state: present
    update_cache: true

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"

- name: Configure sysctl settings for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - {key: "net.bridge.bridge-nf-call-iptables", value: "1"}
    - {key: "net.bridge.bridge-nf-call-ip6tables", value: "1"}
    - {key: "net.ipv4.ip_forward", value: "1"}
    - {key: "fs.inotify.max_user_instances", value: "8192"}
    - {key: "fs.inotify.max_user_watches", value: "524288"}

- name: Ensure k3s local storage directory exists
  ansible.builtin.file:
    path: "{{ local_storage_path }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Ensure power-profiles-daemon is running
  ansible.builtin.systemd:
    name: power-profiles-daemon
    enabled: true
    state: started

- name: Read the current power profile
  ansible.builtin.command: powerprofilesctl get
  register: current_power_profile
  changed_when: false
  check_mode: false

- name: Set the power profile
  ansible.builtin.command: powerprofilesctl set {{ power_profile }}
  when: current_power_profile.stdout | trim != power_profile
  changed_when: true
